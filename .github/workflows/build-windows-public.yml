name: Build Windows Executable (Public / Subscription)

# Builds the public-mode version of the app that connects to the
# pudo-booking-pub Firebase project. Users log in with accounts created
# on the subscription homepage and must have an active subscription.
#
# Triggers automatically on push to the `public` branch, or manually.
#
# Required GitHub secrets:
#   PUBLIC_MODE                   — true
#   API_BASE_URL                  — https://api-pudo.co.za/api/v1
#   GOOGLE_MAPS_API_KEY           — Google Maps API key (can share with internal)
#   FIREBASE_API_KEY              — Firebase API key for pudo-booking-pub
#   FIREBASE_AUTH_DOMAIN          — pudo-booking-pub.firebaseapp.com
#   FIREBASE_PROJECT_ID           — pudo-booking-pub
#   FIREBASE_STORAGE_BUCKET       — pudo-booking-pub.firebasestorage.app
#   FIREBASE_MESSAGING_SENDER_ID  — 418497457347
#   FIREBASE_APP_ID               — 1:418497457347:web:f2e7ccf9fa94b603420676
#   FIREBASE_MEASUREMENT_ID       — G-WPJJD30M12
#   FIREBASE_SERVICE_ACCOUNT_JSON — GCP service account JSON with Storage Object Admin
#                                   role on pudo-booking-pub.firebasestorage.app

on:
  push:
    branches:
      - public
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for this build (e.g. v1.0 public release)"
        required: false
        default: ""

jobs:
  build-windows-public:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          missing=""
          [ -z "${{ secrets.PUBLIC_MODE }}" ]           && missing="$missing PUBLIC_MODE"
          [ -z "${{ secrets.FIREBASE_API_KEY }}" ]      && missing="$missing FIREBASE_API_KEY"
          [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]  && missing="$missing FIREBASE_AUTH_DOMAIN"
          [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]   && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "${{ secrets.API_BASE_URL }}" ]           && missing="$missing API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing"
            echo "Go to repo Settings → Secrets and variables → Actions and add the missing secrets."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Create config.json for public mode
        shell: bash
        run: |
          cat > config.json << 'EOF'
          {
            "PUBLIC_MODE": ${{ secrets.PUBLIC_MODE }},
            "PUDO_API_KEY": "",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_MAPS_API_KEY": "${{ secrets.GOOGLE_MAPS_API_KEY }}",
            "FIREBASE": {
              "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
              "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
              "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              "appId": "${{ secrets.FIREBASE_APP_ID }}",
              "measurementId": "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
            }
          }
          EOF

      - name: Generate app icons
        run: node scripts/generate-icons.js

      - name: Build Vite (React frontend)
        run: npm run build

      - name: Build Windows executable
        run: npx electron-builder --win --publish=never

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in dist/"; exit 1 }
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Copy installer to stable filename
        shell: pwsh
        run: |
          Copy-Item "${{ steps.locate.outputs.exe_path }}" "dist\PudoBookingApp-Setup.exe"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload installer to Firebase Storage (stable URL)
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: dist/PudoBookingApp-Setup.exe
          destination: pudo-booking-pub.firebasestorage.app/downloads/windows
          gzip: false
          headers: |-
            cache-control: no-cache, no-store, must-revalidate

      - name: Zip the installer (GitHub artifact archive)
        shell: pwsh
        run: |
          $zipName = "PudoBookingApp-Public-${{ github.run_number }}.zip"
          Compress-Archive -Path "dist\PudoBookingApp-Setup.exe" -DestinationPath "dist\$zipName"
          Write-Output "Created $zipName"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: PudoBookingApp-Public-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 90
