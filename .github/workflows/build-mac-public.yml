name: Build macOS Executable (Public / Subscription)

# Builds the public-mode version of the app for macOS that connects to the
# pudo-booking-pub Firebase project. Users log in with accounts created
# on the subscription homepage and must have an active subscription.
#
# Required GitHub secrets (same as the Windows public build):
#   PUB_API_BASE_URL                  — https://api-pudo.co.za/api/v1
#   PUB_GOOGLE_MAPS_API_KEY           — Google Maps API key
#   PUB_FIREBASE_API_KEY              — Firebase API key for pudo-booking-pub
#   PUB_FIREBASE_AUTH_DOMAIN          — pudo-booking-pub.firebaseapp.com
#   PUB_FIREBASE_PROJECT_ID           — pudo-booking-pub
#   PUB_FIREBASE_STORAGE_BUCKET       — pudo-booking-pub.firebasestorage.app
#   PUB_FIREBASE_MESSAGING_SENDER_ID  — 418497457347
#   PUB_FIREBASE_APP_ID               — 1:418497457347:web:f2e7ccf9fa94b603420676
#   PUB_FIREBASE_MEASUREMENT_ID       — G-WPJJD30M12
#
# Note: The resulting DMG is unsigned. macOS users will need to allow the app
# via System Settings → Privacy & Security → "Open Anyway" on first launch.

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for this build (e.g. v1.0 public release)"
        required: false
        default: ""

jobs:
  build-mac-public:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create config.json for public mode
        shell: bash
        run: |
          cat > config.json << 'EOF'
          {
            "PUBLIC_MODE": true,
            "PUDO_API_KEY": "",
            "API_BASE_URL": "${{ secrets.PUB_API_BASE_URL }}",
            "GOOGLE_MAPS_API_KEY": "${{ secrets.PUB_GOOGLE_MAPS_API_KEY }}",
            "FIREBASE": {
              "apiKey": "${{ secrets.PUB_FIREBASE_API_KEY }}",
              "authDomain": "${{ secrets.PUB_FIREBASE_AUTH_DOMAIN }}",
              "projectId": "${{ secrets.PUB_FIREBASE_PROJECT_ID }}",
              "storageBucket": "${{ secrets.PUB_FIREBASE_STORAGE_BUCKET }}",
              "messagingSenderId": "${{ secrets.PUB_FIREBASE_MESSAGING_SENDER_ID }}",
              "appId": "${{ secrets.PUB_FIREBASE_APP_ID }}",
              "measurementId": "${{ secrets.PUB_FIREBASE_MEASUREMENT_ID }}"
            }
          }
          EOF

      - name: Build Vite (React frontend)
        run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish=never

      - name: Zip the DMG
        shell: bash
        run: |
          dmg_file=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg_file" ]; then
            echo "No .dmg file found in dist/"
            exit 1
          fi
          zip_name="PudoBookingApp-Mac-${{ github.run_number }}.zip"
          zip -j "dist/$zip_name" "$dmg_file"
          echo "Created $zip_name from $dmg_file"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PudoBookingApp-Mac-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 90
