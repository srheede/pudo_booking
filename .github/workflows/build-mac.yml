name: Build macOS Executable

# Builds the macOS app. Behaviour is controlled by GitHub Secrets:
#
#   PUBLIC_MODE = false  →  Internal build. PUDO_API_KEY is baked in from secrets.
#   PUBLIC_MODE = true   →  Public/subscription build. PUDO_API_KEY is empty;
#                           users supply their own key via Firebase profile.
#                           The DMG is also uploaded to Firebase Storage.
#
# Required GitHub secrets:
#   PUBLIC_MODE                   — true or false
#   PUDO_API_KEY                  — Pudo API key (used when PUBLIC_MODE=false)
#   API_BASE_URL                  — https://api-pudo.co.za/api/v1
#   GOOGLE_MAPS_API_KEY           — Google Maps API key
#   FIREBASE_API_KEY              — Firebase API key
#   FIREBASE_AUTH_DOMAIN          — Firebase auth domain
#   FIREBASE_PROJECT_ID           — Firebase project ID
#   FIREBASE_STORAGE_BUCKET       — Firebase storage bucket
#   FIREBASE_MESSAGING_SENDER_ID  — Firebase messaging sender ID
#   FIREBASE_APP_ID               — Firebase app ID
#   FIREBASE_MEASUREMENT_ID       — Firebase measurement ID
#   FIREBASE_SERVICE_ACCOUNT_JSON — GCP service account JSON (required when PUBLIC_MODE=true)
#
# Note: The resulting DMG is unsigned. macOS users will need to allow the app
# via System Settings → Privacy & Security → "Open Anyway" on first launch.

on:
  push:
    branches:
      - public
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for this build (e.g. v1.0 release)"
        required: false
        default: ""

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLIC_MODE: ${{ secrets.PUBLIC_MODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          missing=""
          [ -z "${{ secrets.PUBLIC_MODE }}" ]           && missing="$missing PUBLIC_MODE"
          [ -z "${{ secrets.FIREBASE_API_KEY }}" ]      && missing="$missing FIREBASE_API_KEY"
          [ -z "${{ secrets.FIREBASE_AUTH_DOMAIN }}" ]  && missing="$missing FIREBASE_AUTH_DOMAIN"
          [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]   && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "${{ secrets.API_BASE_URL }}" ]          && missing="$missing API_BASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing"
            echo "Go to repo Settings → Secrets and variables → Actions and add the missing secrets."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Create config.json from secrets
        shell: bash
        run: |
          if [ "${{ secrets.PUBLIC_MODE }}" = "true" ]; then
            PUDO_API_KEY_VALUE=""
          else
            PUDO_API_KEY_VALUE="${{ secrets.PUDO_API_KEY }}"
          fi
          cat > config.json << EOF
          {
            "PUBLIC_MODE": ${{ secrets.PUBLIC_MODE }},
            "PUDO_API_KEY": "$PUDO_API_KEY_VALUE",
            "API_BASE_URL": "${{ secrets.API_BASE_URL }}",
            "GOOGLE_MAPS_API_KEY": "${{ secrets.GOOGLE_MAPS_API_KEY }}",
            "FIREBASE": {
              "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
              "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
              "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              "appId": "${{ secrets.FIREBASE_APP_ID }}",
              "measurementId": "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
            }
          }
          EOF

      - name: Generate app icons
        run: node scripts/generate-icons.js

      - name: Build Vite (React frontend)
        run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish=never

      - name: Copy DMG to stable filename
        shell: bash
        run: |
          dmg=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then echo "No .dmg found in dist/" && exit 1; fi
          cp "$dmg" dist/PudoBookingApp.dmg

      - name: Authenticate to Google Cloud (public mode only)
        if: env.PUBLIC_MODE == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload DMG to Firebase Storage (public mode only)
        if: env.PUBLIC_MODE == 'true'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: dist/PudoBookingApp.dmg
          destination: pudo-booking-pub.firebasestorage.app/downloads/mac
          gzip: false
          headers: |-
            cache-control: no-cache, no-store, must-revalidate

      - name: Zip the DMG
        shell: bash
        run: |
          zip_name="PudoBookingApp-Mac-${{ github.run_number }}.zip"
          zip -j "dist/$zip_name" dist/PudoBookingApp.dmg
          echo "Created $zip_name"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: PudoBookingApp-Mac-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 90
