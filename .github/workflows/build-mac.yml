name: Build macOS Executable

# ──────────────────────────────────────────────────────────────────────────────
# TWO BUILD MODES — controlled by the PUBLIC_MODE secret:
#
#  PUBLIC_MODE = false  →  INTERNAL build
#    • Single-user / developer build.
#    • The PUDO API key is baked into the app from the PUDO_API_KEY secret.
#    • No subscription or Firebase Auth checks at runtime.
#    • Uses the INTERNAL Firebase project (set via FIREBASE_* secrets).
#    • The DMG is uploaded as a GitHub Actions artifact only.
#
#  PUBLIC_MODE = true   →  PUBLIC / SUBSCRIPTION build
#    • Multi-user build distributed to paying customers.
#    • Users authenticate via Firebase Auth and supply their own PUDO API key
#      through their Firebase profile (no key is baked in).
#    • Subscription status is read from Firestore on every login.
#    • Uses the PUBLIC Firebase project (set via PUBLIC_FIREBASE_* secrets),
#      which may use a named Firestore database (PUBLIC_FIREBASE_DATABASE_ID).
#    • The DMG is uploaded to Firebase Storage as well as a GitHub artifact.
#
# ──────────────────────────────────────────────────────────────────────────────
# SECRETS REQUIRED FOR EVERY BUILD:
#   PUBLIC_MODE                        — "true" or "false"
#   API_BASE_URL                       — https://api-pudo.co.za/api/v1
#   GOOGLE_MAPS_API_KEY                — Google Maps API key
#
# ADDITIONAL SECRET FOR PUBLIC BUILDS ONLY (installer upload to Firebase Storage):
#   FIREBASE_SERVICE_ACCOUNT_JSON      — see "FIREBASE_SERVICE_ACCOUNT_JSON" note below
#
# SECRETS FOR INTERNAL MODE (PUBLIC_MODE=false):
#   PUDO_API_KEY                       — Pudo API key baked into the app
#   FIREBASE_API_KEY                   — Internal Firebase project API key
#   FIREBASE_AUTH_DOMAIN               — e.g. pudo-booking.firebaseapp.com
#   FIREBASE_PROJECT_ID                — e.g. pudo-booking
#   FIREBASE_STORAGE_BUCKET            — e.g. pudo-booking.firebasestorage.app
#   FIREBASE_MESSAGING_SENDER_ID       — Internal project sender ID
#   FIREBASE_APP_ID                    — Internal project app ID
#   FIREBASE_MEASUREMENT_ID            — Internal project measurement ID (optional)
#
# SECRETS FOR PUBLIC MODE (PUBLIC_MODE=true):
#   PUBLIC_FIREBASE_API_KEY            — Public Firebase project API key
#   PUBLIC_FIREBASE_AUTH_DOMAIN        — e.g. pudo-booking-pub.firebaseapp.com
#   PUBLIC_FIREBASE_PROJECT_ID         — e.g. pudo-booking-pub
#   PUBLIC_FIREBASE_DATABASE_ID        — Named Firestore database ID (e.g. pudo-booking-pub)
#                                        Leave empty to use the "(default)" database.
#   PUBLIC_FIREBASE_STORAGE_BUCKET     — e.g. pudo-booking-pub.firebasestorage.app
#   PUBLIC_FIREBASE_MESSAGING_SENDER_ID — Public project sender ID
#   PUBLIC_FIREBASE_APP_ID             — Public project app ID
#   PUBLIC_FIREBASE_MEASUREMENT_ID     — Public project measurement ID (optional)
#   Also required so privileged emails can open the private side of the app:
#   INTERNAL_EMAILS                    — Comma-separated emails (e.g. you@example.com)
#   PUDO_API_KEY                       — Baked key used when those emails sign in
#   FIREBASE_*                         — Internal Firebase credentials (as INTERNAL_FIREBASE)
#
# FIREBASE_SERVICE_ACCOUNT_JSON (PUBLIC builds only)
#   This is NOT the same as the Firebase web config (apiKey, appId, …).
#   It is a Google Cloud service account key used only by GitHub Actions to
#   upload the built DMG to Firebase Storage in the PUBLIC project.
#   • Create it in Google Cloud Console → select project "pudo-booking-pub"
#     (same GCP project as your public Firebase app).
#   • IAM & Admin → Service Accounts → create or pick an account → Keys → Add key → JSON.
#   • Grant the account a role that can write objects to your download bucket,
#     e.g. "Storage Object Admin" on the bucket, or "Firebase Admin" for simplicity.
#   • Paste the entire JSON file contents into the GitHub secret.
#   Internal builds (PUBLIC_MODE=false) skip Storage upload and do not need this secret.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - public
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for this build (e.g. v1.0 release)"
        required: false
        default: ""

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Exposed as env (not only secrets) so step `if:` can branch — GitHub forbids `secrets` in `if:`.
      PUBLIC_MODE: ${{ secrets.PUBLIC_MODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        # Secrets are passed as env vars to avoid inline interpolation issues with
        # multi-line values (e.g. FIREBASE_SERVICE_ACCOUNT_JSON) that break bash's [ test.
        env:
          SECRET_PUBLIC_MODE: ${{ secrets.PUBLIC_MODE }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SECRET_PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          SECRET_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          SECRET_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          SECRET_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          SECRET_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SECRET_PUDO_API_KEY: ${{ secrets.PUDO_API_KEY }}
          SECRET_INTERNAL_EMAILS: ${{ secrets.INTERNAL_EMAILS }}
          SECRET_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SECRET_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          SECRET_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SECRET_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -z "$SECRET_PUBLIC_MODE" ]    && missing="$missing PUBLIC_MODE"
          [ -z "$SECRET_API_BASE_URL" ]   && missing="$missing API_BASE_URL"

          if [ "$SECRET_PUBLIC_MODE" = "true" ]; then
            # ── Public mode: require PUBLIC_FIREBASE_* + service account for Storage upload ─
            [ -z "$SECRET_PUBLIC_FIREBASE_API_KEY" ]             && missing="$missing PUBLIC_FIREBASE_API_KEY"
            [ -z "$SECRET_PUBLIC_FIREBASE_AUTH_DOMAIN" ]         && missing="$missing PUBLIC_FIREBASE_AUTH_DOMAIN"
            [ -z "$SECRET_PUBLIC_FIREBASE_PROJECT_ID" ]          && missing="$missing PUBLIC_FIREBASE_PROJECT_ID"
            [ -z "$SECRET_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" ] && missing="$missing PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
            [ -z "$SECRET_PUBLIC_FIREBASE_APP_ID" ]              && missing="$missing PUBLIC_FIREBASE_APP_ID"
            [ -z "$SECRET_FIREBASE_SERVICE_ACCOUNT_JSON" ]       && missing="$missing FIREBASE_SERVICE_ACCOUNT_JSON"
            # Private-email override: also need internal Firebase + emails + PUDO key
            [ -z "$SECRET_INTERNAL_EMAILS" ]               && missing="$missing INTERNAL_EMAILS"
            [ -z "$SECRET_PUDO_API_KEY" ]                   && missing="$missing PUDO_API_KEY"
            [ -z "$SECRET_FIREBASE_API_KEY" ]               && missing="$missing FIREBASE_API_KEY"
            [ -z "$SECRET_FIREBASE_AUTH_DOMAIN" ]           && missing="$missing FIREBASE_AUTH_DOMAIN"
            [ -z "$SECRET_FIREBASE_PROJECT_ID" ]            && missing="$missing FIREBASE_PROJECT_ID"
            [ -z "$SECRET_FIREBASE_MESSAGING_SENDER_ID" ]   && missing="$missing FIREBASE_MESSAGING_SENDER_ID"
            [ -z "$SECRET_FIREBASE_APP_ID" ]                && missing="$missing FIREBASE_APP_ID"
          else
            # ── Internal mode: require PUDO_API_KEY + FIREBASE_* credentials ─
            [ -z "$SECRET_PUDO_API_KEY" ]               && missing="$missing PUDO_API_KEY"
            [ -z "$SECRET_FIREBASE_API_KEY" ]           && missing="$missing FIREBASE_API_KEY"
            [ -z "$SECRET_FIREBASE_AUTH_DOMAIN" ]       && missing="$missing FIREBASE_AUTH_DOMAIN"
            [ -z "$SECRET_FIREBASE_PROJECT_ID" ]        && missing="$missing FIREBASE_PROJECT_ID"
            [ -z "$SECRET_FIREBASE_MESSAGING_SENDER_ID" ] && missing="$missing FIREBASE_MESSAGING_SENDER_ID"
            [ -z "$SECRET_FIREBASE_APP_ID" ]            && missing="$missing FIREBASE_APP_ID"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing"
            echo "Go to repo Settings → Secrets and variables → Actions and add the missing secrets."
            exit 1
          fi
          echo "All required secrets are present. PUBLIC_MODE=$SECRET_PUBLIC_MODE"

      - name: Create config.json from secrets
        env:
          CFG_PUBLIC_MODE: ${{ secrets.PUBLIC_MODE }}
          CFG_PUDO_API_KEY: ${{ secrets.PUDO_API_KEY }}
          CFG_INTERNAL_EMAILS: ${{ secrets.INTERNAL_EMAILS }}
          CFG_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CFG_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Internal Firebase credentials (used when PUBLIC_MODE=false, or as INTERNAL_FIREBASE override)
          CFG_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          CFG_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          CFG_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CFG_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          CFG_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          CFG_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CFG_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          # Public Firebase credentials (used when PUBLIC_MODE=true)
          CFG_PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          CFG_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          CFG_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          CFG_PUBLIC_FIREBASE_DATABASE_ID: ${{ secrets.PUBLIC_FIREBASE_DATABASE_ID }}
          CFG_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          CFG_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          CFG_PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          CFG_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          node -e "
            const e = process.env;
            const isPublic = e.CFG_PUBLIC_MODE === 'true';

            const stripEmpty = (obj) => {
              Object.keys(obj).forEach(k => { if (!obj[k]) delete obj[k]; });
              return obj;
            };

            const buildInternalFirebase = () => stripEmpty({
              apiKey:            e.CFG_FIREBASE_API_KEY,
              authDomain:        e.CFG_FIREBASE_AUTH_DOMAIN,
              projectId:         e.CFG_FIREBASE_PROJECT_ID,
              storageBucket:     e.CFG_FIREBASE_STORAGE_BUCKET,
              messagingSenderId: e.CFG_FIREBASE_MESSAGING_SENDER_ID,
              appId:             e.CFG_FIREBASE_APP_ID,
              measurementId:     e.CFG_FIREBASE_MEASUREMENT_ID,
            });

            // Select the correct Firebase config based on build mode.
            // PUBLIC_MODE=true  → PUBLIC_FIREBASE_* secrets (pudo-booking-pub project)
            // PUBLIC_MODE=false → FIREBASE_* secrets        (internal project)
            let firebase;
            if (isPublic) {
              firebase = {
                apiKey:            e.CFG_PUBLIC_FIREBASE_API_KEY,
                authDomain:        e.CFG_PUBLIC_FIREBASE_AUTH_DOMAIN,
                projectId:         e.CFG_PUBLIC_FIREBASE_PROJECT_ID,
                storageBucket:     e.CFG_PUBLIC_FIREBASE_STORAGE_BUCKET,
                messagingSenderId: e.CFG_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,
                appId:             e.CFG_PUBLIC_FIREBASE_APP_ID,
                measurementId:     e.CFG_PUBLIC_FIREBASE_MEASUREMENT_ID,
              };
              // Named Firestore database — only present in the public project.
              if (e.CFG_PUBLIC_FIREBASE_DATABASE_ID) {
                firebase.databaseId = e.CFG_PUBLIC_FIREBASE_DATABASE_ID;
              }
            } else {
              firebase = buildInternalFirebase();
              // Internal project uses the '(default)' Firestore database — no databaseId needed.
            }

            stripEmpty(firebase);

            const internalEmails = (e.CFG_INTERNAL_EMAILS || '')
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const config = {
              PUBLIC_MODE: isPublic,
              // Always bake the key: internal builds use it for everyone;
              // public builds use it only for INTERNAL_EMAILS private sessions.
              PUDO_API_KEY: e.CFG_PUDO_API_KEY || '',
              API_BASE_URL: e.CFG_API_BASE_URL,
              GOOGLE_MAPS_API_KEY: e.CFG_GOOGLE_MAPS_API_KEY,
              INTERNAL_EMAILS: internalEmails,
              FIREBASE: firebase,
            };

            if (isPublic) {
              config.INTERNAL_FIREBASE = buildInternalFirebase();
            }

            require('fs').writeFileSync('config.json', JSON.stringify(config, null, 2));
            console.log('config.json written:');
            console.log('  PUBLIC_MODE   :', config.PUBLIC_MODE);
            console.log('  Firebase project:', firebase.projectId);
            console.log('  Firebase database:', firebase.databaseId || '(default)');
            console.log('  PUDO key present:', !!config.PUDO_API_KEY);
            console.log('  INTERNAL_EMAILS:', config.INTERNAL_EMAILS.length);
            console.log('  INTERNAL_FIREBASE:', !!config.INTERNAL_FIREBASE);
          "

      - name: Generate app icons
        run: node scripts/generate-icons.js

      - name: Build Vite (React frontend)
        run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish=never

      - name: Copy DMG to stable filename
        shell: bash
        run: |
          dmg=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then echo "No .dmg found in dist/" && exit 1; fi
          cp "$dmg" dist/PudoBookingApp.dmg

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload DMG to Firebase Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: dist/PudoBookingApp.dmg
          destination: pudo-booking-pub.firebasestorage.app/downloads/mac
          gzip: false
          headers: |-
            cache-control: no-cache, no-store, must-revalidate

      - name: Zip the DMG
        shell: bash
        run: |
          zip_name="PudoBookingApp-Mac-${{ github.run_number }}.zip"
          zip -j "dist/$zip_name" dist/PudoBookingApp.dmg
          echo "Created $zip_name"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: PudoBookingApp-Mac-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 90
